<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sevgilim ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont;
}

body{
background:black;
color:white;
overflow:hidden;
}

/* orientation warning */

#rotateWarning{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:24px;
z-index:999;
}

.hidden{
display:none;
}

/* glass */

.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
padding:40px;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

/* input */

input{
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:10px;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
margin-top:10px;
cursor:pointer;
}

/* video */

video{
max-width:100%;
border-radius:15px;
}

/* intro */

#introVideo{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
display:none;
}

/* letter */

#letterScreen{
display:none;
}

#letter{
width:220px;
cursor:pointer;
animation:float 3s ease-in-out infinite;
}

@keyframes float{

0%{transform:translateY(0)}
50%{transform:translateY(-20px)}
100%{transform:translateY(0)}

}

/* message */

#message{
display:none;
text-align:center;
padding:40px;
overflow-y:auto;
height:100vh;
}

#timer{
margin-top:20px;
font-size:20px;
opacity:.8;
}

/* gallery */

.gallery{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin-top:40px;
}

.gallery img,
.gallery video{
width:160px;
border-radius:12px;
cursor:pointer;
}

/* viewer */

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
justify-content:center;
align-items:center;
z-index:10;
}

#viewer img,
#viewer video{
max-width:95%;
max-height:95%;
}

/* timeline */

.timeline{
margin-top:50px;
max-width:600px;
margin-left:auto;
margin-right:auto;
text-align:left;
}

.event{
opacity:0;
transform:translateY(30px);
transition:1s;
margin-bottom:20px;
}

.event.show{
opacity:1;
transform:translateY(0);
}

/* hearts */

#heartCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

</style>
</head>

<body>

<div id="rotateWarning">

Telefonu yan tutun 📱➡️

</div>

<canvas id="heartCanvas"></canvas>

<!-- CODE -->

<div id="codeScreen" class="center glass hidden">

<h2>İpucu: Tanış olduğumuz tarix ❤️</h2>

<input id="codeInput" type="password">

<br>

<button onclick="checkCode()">Daxil ol</button>

<p id="error"></p>

</div>

<!-- VIDEO -->

<video id="introVideo" src="intro.mp4"></video>

<!-- LETTER -->

<div id="letterScreen" class="center">

<img id="letter" src="letter.png">

<p>Mənə toxun 💌</p>

</div>

<!-- MESSAGE -->

<div id="message">

<h1>Ad günün mübarək sevgilim ❤️</h1>

<p>Sən həyatımın ən gözəl möcüzəsisən.</p>

<div id="timer"></div>

<!-- GALLERY -->

<div class="gallery" id="gallery"></div>

<!-- LOVE STORY -->

<div class="timeline">

<div class="event">❤️ 25.08.2025 – Tanış olduq</div>
<div class="event">💬 İlk uzun söhbətimiz</div>
<div class="event">🌙 İlk gecə mesajlaşmamız</div>
<div class="event">💖 Mənim üçün xüsusi oldun</div>
<div class="event">♾ Sonsuza qədər birlikdə</div>

</div>

</div>

<div id="viewer"></div>

<audio id="music" src="audio.mp3"></audio>

<script>

/* orientation */

function checkOrientation(){

if(window.innerHeight>window.innerWidth){

rotateWarning.style.display="flex"

}else{

rotateWarning.style.display="none"
codeScreen.classList.remove("hidden")

}

}

window.addEventListener("resize",checkOrientation)
checkOrientation()


/* gallery media */

const media=[

"foto1.png",
"foto2.png",
"foto3.png",
"foto4.png",
"foto5.png",
"foto6.png",
"video7.mp4",
"foto8.png",
"foto9.png",
"foto10.png",
"video11.mp4",
"foto12.png",
"foto13.png",
"video14.mp4",
"video15.mp4",
"video16.mp4",
"video17.mp4"

]

media.forEach(src=>{

let el

if(src.includes(".mp4")){

el=document.createElement("video")
el.src=src
el.muted=true
el.loop=true
el.autoplay=true

}else{

el=document.createElement("img")
el.src=src

}

gallery.appendChild(el)

el.onclick=()=>openViewer(src)

})


function openViewer(src){

viewer.innerHTML=""

viewer.style.display="flex"

if(src.includes(".mp4")){

let v=document.createElement("video")
v.src=src
v.controls=true
v.autoplay=true
viewer.appendChild(v)

}else{

let i=document.createElement("img")
i.src=src
viewer.appendChild(i)

}

}

viewer.onclick=()=>viewer.style.display="none"


/* code */

let attempts=0

function checkCode(){

if(codeInput.value==="25082025"){

codeScreen.style.display="none"

introVideo.style.display="block"

introVideo.play()

introVideo.onended=()=>{

introVideo.style.display="none"
letterScreen.style.display="block"

}

}else{

attempts++
error.innerText="Yanlış kod"

if(attempts>=3){

localStorage.setItem("blocked",true)

}

}

}

/* letter */

letter.onclick=()=>{

letterScreen.style.display="none"
message.style.display="block"

music.play()

startTimer()
showTimeline()

}

/* timer */

function startTimer(){

let start=new Date("2025-08-25T14:23:00")

setInterval(()=>{

let now=new Date()

let diff=now-start

let m=Math.floor(diff/60000)%60
let h=Math.floor(diff/3600000)%24
let d=Math.floor(diff/86400000)%30
let mo=Math.floor(diff/2592000000)

timer.innerText=
mo+" ay "+d+" gün "+h+" saat "+m+" dəqiqə"

},1000)

}

/* timeline */

function showTimeline(){

document.querySelectorAll(".event").forEach((e,i)=>{

setTimeout(()=>{

e.classList.add("show")

},i*1200)

})

}

/* hearts */

const canvas=document.getElementById("heartCanvas")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let hearts=[]

for(let i=0;i<80;i++){

hearts.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*5+2,
speed:Math.random()*1+0.3

})

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

hearts.forEach(h=>{

ctx.fillStyle="red"
ctx.font=h.size*5+"px Arial"
ctx.fillText("❤",h.x,h.y)

h.y+=h.speed

if(h.y>canvas.height){

h.y=0
h.x=Math.random()*canvas.width

}

})

requestAnimationFrame(draw)

}

draw()

</script>

</body>
</html>
