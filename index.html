<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#111;
}

/* PHONE FRAME */

#phone{
width:390px;
height:844px;
background:black;
border-radius:40px;
overflow:hidden;
position:relative;
box-shadow:0 0 40px rgba(0,0,0,0.8);
border:8px solid #111;
color:white;
text-align:center;
}

/* LOCK */

#lock{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px #ff4fa3;
}

input{
padding:10px;
font-size:18px;
border-radius:6px;
border:none;
text-align:center;
}

button{
margin-top:10px;
padding:10px 20px;
background:#ff4fa3;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

/* VIDEO */

#videoPage{
display:none;
position:absolute;
width:100%;
height:100%;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* AFTER VIDEO */

#afterVideo{
display:none;
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* LETTER */

#letter{
width:200px;
cursor:pointer;
animation:shake 1s infinite;
}

@keyframes shake{
0%{transform:rotate(0)}
25%{transform:rotate(2deg)}
50%{transform:rotate(-2deg)}
75%{transform:rotate(2deg)}
100%{transform:rotate(0)}
}

/* MESSAGE */

#message{
display:none;
max-width:320px;
margin:15px;
line-height:1.5;
z-index:10;
background:rgba(0,0,0,0.6);
padding:15px;
border-radius:10px;
}

/* BOOK */

#book{
display:none;
width:320px;
height:420px;
}

.pageImg{
width:100%;
height:100%;
object-fit:contain;
border-radius:10px;
animation:pageFade 0.6s;
}

@keyframes pageFade{
from{opacity:0; transform:scale(0.9);}
to{opacity:1; transform:scale(1);}
}

/* POLAROID */

#scatter{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.polaroid{
position:absolute;
background:white;
padding:8px;
box-shadow:0 6px 15px rgba(0,0,0,0.6);
border-radius:6px;
animation:dropPhoto 1.2s forwards;
}

.polaroid img{
width:120px;
}

@keyframes dropPhoto{

0%{
opacity:0;
transform:translateY(-200px) rotate(-20deg);
}

100%{
opacity:1;
transform:translateY(0) rotate(var(--r));
}

}

</style>
</head>

<body>

<div id="phone">

<!-- LOCK -->

<div id="lock">

<h3>Sevgi kodunu daxil et</h3>

<input type="text" id="code">

<br>

<button onclick="checkCode()">Aç</button>

<p id="chance">Şans: 3</p>

</div>

<!-- VIDEO -->

<div id="videoPage">

<video id="video">
<source src="intro.mp4">
</video>

</div>

<!-- AFTER VIDEO -->

<div id="afterVideo">

<img src="letter.png" id="letter" onclick="openLetter()">

<div id="message">

<h3>Ad günün mübarək sevgilim ❤️</h3>

<p>
Sən həyatımın ən gözəl hissəsisən.
Səninlə keçirdiyim hər an mənim üçün çox dəyərlidir.
Həmişə gülməyini və xoşbəxt olmağını istəyirəm.
Səni çox sevirəm ❤️
</p>

</div>

<div id="book"></div>

</div>

<div id="scatter"></div>

<audio id="audio">
<source src="audio.mp3">
</audio>

</div>

<script>

/* CODE */

let correct="25082025"
let chance=3

function checkCode(){

let val=document.getElementById("code").value

if(val===correct){

document.getElementById("lock").style.display="none"

let videoPage=document.getElementById("videoPage")
videoPage.style.display="block"

let v=document.getElementById("video")

v.play()

v.onended=()=>{

videoPage.style.display="none"

document.getElementById("afterVideo").style.display="flex"

}

}else{

chance--

document.getElementById("chance").innerText="Şans: "+chance

if(chance<=0){

document.getElementById("chance").innerText="Sayt bloklandı ❤️"

}

}

}

/* LETTER */

function openLetter(){

let l=document.getElementById("letter")

l.style.transition="2s"
l.style.opacity="0"

setTimeout(()=>{

l.style.display="none"

document.getElementById("message").style.display="block"

createBook()

},2000)

}

/* BOOK */

let page=1
let total=6

function createBook(){

let book=document.getElementById("book")

book.style.display="block"

let audio=document.getElementById("audio")

audio.play()

audio.onended=()=>{

window.close()

}

showPage()

book.onclick=nextPage

}

function showPage(){

let book=document.getElementById("book")

book.innerHTML=""

let img=document.createElement("img")

img.src="foto"+page+".png"

img.className="pageImg"

book.appendChild(img)

}

function nextPage(){

page++

if(page>total){

closeBook()
return

}

showPage()

}

/* FINAL */

function closeBook(){

document.getElementById("book").style.display="none"

let scatter=document.getElementById("scatter")

scatter.style.display="block"

let positions=[
[20,25],[60,20],[40,55],[70,60],[15,60],[55,35]
]

for(let i=1;i<=6;i++){

let div=document.createElement("div")

div.className="polaroid"

div.style.left=positions[i-1][0]+"%"
div.style.top=positions[i-1][1]+"%"

div.style.setProperty("--r",(Math.random()*20-10)+"deg")

let img=document.createElement("img")

img.src="foto"+i+".png"

div.appendChild(img)

scatter.appendChild(div)

}

}

</script>

</body>
</html>
