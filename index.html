<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#111;
}

/* PHONE */

#phone{
width:390px;
height:844px;
background:black;
border-radius:40px;
overflow:hidden;
position:relative;
color:white;
}

/* LOCK */

#lock{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
padding:30px;
border-radius:20px;
box-shadow:0 0 25px #ff4fa3;
}

input{
padding:10px;
font-size:18px;
border:none;
border-radius:6px;
text-align:center;
}

button{
margin-top:10px;
padding:10px 20px;
background:#ff4fa3;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

/* VIDEO */

#videoPage{
display:none;
position:absolute;
width:100%;
height:100%;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* AFTER VIDEO */

#afterVideo{
display:none;
position:absolute;
width:100%;
height:100%;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* LETTER */

#letter{
width:200px;
cursor:pointer;
animation:shake 1s infinite;
}

@keyframes shake{
0%{transform:rotate(0)}
25%{transform:rotate(2deg)}
50%{transform:rotate(-2deg)}
75%{transform:rotate(2deg)}
100%{transform:rotate(0)}
}

/* MESSAGE */

#message{
display:none;
max-width:320px;
margin:15px;
background:rgba(0,0,0,0.6);
padding:15px;
border-radius:10px;
}

/* BOOK */

#book{
display:none;
width:320px;
height:420px;
}

.pageImg{
width:100%;
height:100%;
object-fit:contain;
}

/* POLAROID */

#scatter{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.polaroid{
position:absolute;
background:white;
padding:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.6);
border-radius:6px;
animation:drop 1s forwards;
}

.polaroid img{
width:120px;
}

@keyframes drop{
0%{
opacity:0;
transform:translateY(-200px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div id="phone">

<div id="lock">

<h3>Sevgi kodu</h3>

<input type="text" id="code">

<br>

<button onclick="checkCode()">Aç</button>

<p id="chance">Şans: 3</p>

</div>

<div id="videoPage">

<video id="video">
<source src="intro.mp4">
</video>

</div>

<div id="afterVideo">

<img src="letter.png" id="letter" onclick="openLetter()">

<div id="message">

<h3>Ad günün mübarək sevgilim ❤️</h3>

<p>
Sən həyatımın ən gözəl hissəsisən.
Səninlə keçirdiyim hər an mənim üçün çox dəyərlidir.
Həmişə gülməyini və xoşbəxt olmağını istəyirəm.
Səni çox sevirəm ❤️
</p>

</div>

<div id="book"></div>

</div>

<div id="scatter"></div>

<audio id="audio">
<source src="audio.mp3">
</audio>

</div>

<script>

/* CODE */

let correct="25082025"
let chance=3

function checkCode(){

let val=document.getElementById("code").value

if(val===correct){

document.getElementById("lock").style.display="none"

let v=document.getElementById("video")

document.getElementById("videoPage").style.display="block"

v.play()

v.onended=function(){

document.getElementById("videoPage").style.display="none"

document.getElementById("afterVideo").style.display="flex"

}

}else{

chance--

document.getElementById("chance").innerText="Şans: "+chance

}

}

/* LETTER */

function openLetter(){

let l=document.getElementById("letter")

l.style.opacity="0"

setTimeout(()=>{

l.style.display="none"

document.getElementById("message").style.display="block"

createBook()

},1500)

}

/* BOOK */

let page=1

function createBook(){

let book=document.getElementById("book")

book.style.display="block"

document.getElementById("audio").play()

showPage()

book.onclick=nextPage

}

function showPage(){

let book=document.getElementById("book")

book.innerHTML=""

let img=document.createElement("img")

img.src="foto"+page+".png"

img.className="pageImg"

book.appendChild(img)

}

function nextPage(){

page++

if(page>6){

closeBook()

return

}

showPage()

}

/* FINAL */

function closeBook(){

document.getElementById("book").style.display="none"

let scatter=document.getElementById("scatter")

scatter.style.display="block"

let pos=[[20,25],[60,20],[40,55],[70,60],[15,60],[55,35]]

for(let i=1;i<=6;i++){

let d=document.createElement("div")

d.className="polaroid"

d.style.left=pos[i-1][0]+"%"

d.style.top=pos[i-1][1]+"%"

let img=document.createElement("img")

img.src="foto"+i+".png"

d.appendChild(img)

scatter.appendChild(d)

}

}

</script>

</body>
</html>
