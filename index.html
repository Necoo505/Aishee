<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>❤️</title>

<style>

#message h2{
font-size:32px;
color:#ff4fa3;
text-shadow:0 0 10px #ff4fa3;
}

#message{
position:relative;
z-index:10;
background:rgba(0,0,0,0.6);
padding:20px;
border-radius:10px;
}

#scatter{
z-index:1;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:black;
color:white;
text-align:center;
overflow:hidden;
}

/* LOCK */

#lock{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
padding:40px;
border-radius:20px;
box-shadow:0 0 30px #ff4fa3;
}

input{
padding:10px;
font-size:18px;
border-radius:6px;
border:none;
text-align:center;
}

button{
margin-top:10px;
padding:10px 20px;
background:#ff4fa3;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

/* VIDEO */

#videoPage{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* AFTER VIDEO */

#afterVideo{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* LETTER */

#letter{
width:220px;
cursor:pointer;
animation:shake 1s infinite;
}

@keyframes shake{
0%{transform:rotate(0)}
25%{transform:rotate(2deg)}
50%{transform:rotate(-2deg)}
75%{transform:rotate(2deg)}
100%{transform:rotate(0)}
}

/* MESSAGE */

#message{
display:none;
max-width:700px;
margin:20px;
line-height:1.6;
font-size:22px;
}

/* BOOK */

#book{
display:none;
width:420px;
height:520px;
margin:auto;
}

.pageImg{
width:100%;
height:100%;
object-fit:contain;
border-radius:12px;
animation:pageFade 0.6s;
}

@keyframes pageFade{
from{opacity:0; transform:scale(0.9);}
to{opacity:1; transform:scale(1);}
}

/* POLAROID PHOTOS */

#scatter{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.polaroid{
position:absolute;
background:white;
padding:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.6);
border-radius:6px;
animation:dropPhoto 1.5s ease forwards;
}

.polaroid img{
width:180px;
display:block;
}

@keyframes dropPhoto{

0%{
opacity:0;
transform:translateY(-300px) rotate(-20deg);
}

100%{
opacity:1;
transform:translateY(0) rotate(var(--r));
}

}

</style>
</head>

<body>

<div id="lock">

<h2>Sevgi kodunu daxil et</h2>

<input type="text" id="code">

<br>

<button onclick="checkCode()">Aç</button>

<p id="chance">Şans: 3</p>

</div>

<div id="videoPage">

<video id="video">
<source src="intro.mp4">
</video>

</div>

<div id="afterVideo">

<img src="letter.png" id="letter" onclick="openLetter()">

<div id="message">

<h2>Ad günün mübarək sevgilim ❤️</h2>

<p>
Sən həyatımın ən gözəl hissəsisən.  
Səninlə keçirdiyim hər an mənim üçün çox dəyərlidir.  
Həmişə gülməyini və xoşbəxt olmağını istəyirəm.  
Səni çox sevirəm ❤️
</p>

</div>

<div id="book"></div>

</div>

<div id="scatter"></div>

<audio id="audio">
<source src="audio.mp3">
</audio>

<script>

/* CODE */

let correct="25082025"
let chance=3

function checkCode(){

let val=document.getElementById("code").value

if(val===correct){

document.getElementById("lock").style.display="none"

let videoPage=document.getElementById("videoPage")
videoPage.style.display="block"

let v=document.getElementById("video")

v.play()

v.onended=()=>{

videoPage.style.display="none"

document.getElementById("afterVideo").style.display="flex"

}

}else{

chance--

document.getElementById("chance").innerText="Şans: "+chance

if(chance<=0){

document.getElementById("chance").innerText="Sayt bloklandı ❤️"

}

}

}

/* LETTER */

function openLetter(){

let l=document.getElementById("letter")

l.style.transition="2s"
l.style.opacity="0"

setTimeout(()=>{

l.style.display="none"

document.getElementById("message").style.display="block"

createBook()

},2000)

}

/* BOOK */

let page=1
let total=6

function createBook(){

let book=document.getElementById("book")

book.style.display="block"

let audio=document.getElementById("audio")
audio.play()

audio.onended=()=>{

window.close()

}

showPage()

book.onclick=nextPage

}

function showPage(){

let book=document.getElementById("book")

book.innerHTML=""

let img=document.createElement("img")

img.src="foto"+page+".png"

img.className="pageImg"

book.appendChild(img)

}

function nextPage(){

page++

if(page>total){

closeBook()
return

}

showPage()

}

/* FINAL */

function closeBook(){

document.getElementById("book").style.display="none"

let scatter=document.getElementById("scatter")
scatter.style.display="block"

let positions=[
[20,30],[60,25],[40,60],[75,55],[15,65],[55,40]
]

for(let i=1;i<=6;i++){

let div=document.createElement("div")
div.className="polaroid"

div.style.left=positions[i-1][0]+"%"
div.style.top=positions[i-1][1]+"%"

div.style.setProperty("--r",(Math.random()*20-10)+"deg")

let img=document.createElement("img")
img.src="foto"+i+".png"

div.appendChild(img)

scatter.appendChild(div)

}

}

</script>

</body>
</html>
